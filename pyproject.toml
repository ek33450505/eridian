[project]
name = "eridian"
version = "0.2.0"
description = "Rocky, a typed persona for Claude Code: a SessionStart persona hook, personal-only memory and a status line mood."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ek33450505/eridian"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eridian"]
