[project]
name = "undertone"
version = "0.1.0"
description = "Hands-free, local-first voice conversation with Claude Code on macOS."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy",
    "sounddevice",
    "pymicro-wakeword",
    "pysilero-vad",
    "parakeet-mlx",
]

[project.scripts]
undertone = "undertone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undertone"]
